# Postgres local para desenvolvimento: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudo
      POSTGRES_PASSWORD: estudo
      POSTGRES_DB: estudo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
